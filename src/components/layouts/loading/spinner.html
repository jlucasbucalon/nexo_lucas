<style>
  /* --------------------------------------------------
   NEXO LOADING
-------------------------------------------------- */

  #nexo-loading {
    position: fixed;
    inset: 0;

    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;

    opacity: 1;
    visibility: visible;

    transition:
      opacity 300ms ease,
      visibility 300ms ease;
  }

  #nexo-loading.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .nexo-loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .nexo-loading-spinner {
    width: 32px;
    height: 32px;

    border: 3px solid #ddd;
    border-top-color: #222;

    border-radius: 50%;

    animation: nexo-loading-spin 800ms linear infinite;
  }

  @keyframes nexo-loading-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div class="nexo-loading-content">
  <div class="nexo-loading-spinner"></div>
  <span>Carregando...</span>
</div>
